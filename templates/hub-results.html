<div class="plate-mount">
  <figure class="workflow-plate" aria-labelledby="hub-results">
    <figcaption>
      <div class="slip-header"><span class="slip-name">{{ hub.name }}</span><span class="slip-ref">{{ hub.year }}</span></div>
      <div class="slip-merchant"><strong id="hub-results">What we verified</strong></div>
    </figcaption>
    <ul class="slip-steps">
      {% for result in hub.case.evidence %}
      <li><span class="slip-dot" aria-hidden="true"></span><div><strong>{{ result.title }}</strong><small>{{ result.body }}</small></div></li>
      {% endfor %}
    </ul>
  </figure>
</div>
